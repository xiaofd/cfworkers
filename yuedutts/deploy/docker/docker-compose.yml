services:
  tts:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: legado-tts:latest
    container_name: legado-tts
    restart: unless-stopped
    ports:
      - "18080:8080"
    volumes:
      - ../../data:/app/data
    environment:
      - TTS_MAX_TEXT_LEN=20000
      - TTS_MAX_BODY_BYTES=524288
      - ENGINE_STATUS_CACHE_TTL_SEC=30
      - EDGE_MAX_CONCURRENCY=16
      - EDGE_TOKEN_REFRESH_BEFORE_EXPIRY_SEC=180
      - EDGE_HTTP_TIMEOUT_SEC=180
      - EDGE_HTTP_CONNECT_TIMEOUT_SEC=20
